appId: io.github.freshrss.freshrss-reader
productName: FreshRSS Reader
copyright: Copyright © 2026 FreshRSS Reader contributors (based on Fluent Reader, BSD-3-Clause)
files:
    - "./dist/**/*"
    - "!./dist/fontlist"
    - "!**/*.js.map"
directories:
    output: "./bin/${platform}/${arch}/"
mac:
    darkModeSupport: true
    hardenedRuntime: true
    gatekeeperAssess: false
    entitlements: "./build/entitlements.mac.plist"
    entitlementsInherit: "./build/entitlements.mac.plist"
    notarize: false
    target:
        - dmg
    category: public.app-category.news
    electronLanguages:
        - zh_CN
        - zh_TW
        - en
        - fr
        - es
        - de
        - tr
        - ja
        - sv
        - uk
        - it
        - nl
        - ko
        - ru
        - pt_BR
        - pt_PT
        - cs
        - pl
win:
    target:
        - nsis
nsis:
    oneClick: false
    perMachine: true
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
linux:
    target:
        - AppImage
    icon: build/icons
    category: Utility
    desktop:
        entry:
            StartupWMClass: freshrss-reader
